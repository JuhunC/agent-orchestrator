# Runs the orchestrator on a server. The deploy workflow copies this file to
# DEPLOY_PATH (default ~/agent-orchestrator) and runs `docker compose up -d`.
#
# Put your settings in .env next to this file (see .env.example in the repo).
# For automatic HTTPS, set DOMAIN in .env and start with `--profile https`.

services:
  orchestrator:
    image: ${IMAGE:-ghcr.io/juhunc/agent-orchestrator:latest}
    restart: unless-stopped
    env_file: .env
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${HOST_PORT:-3000}:3000"
    volumes:
      - data:/data
      # Agent profiles (roles, skills, MCP servers). Filled with examples on first start;
      # edit them here or in the admin UI.
      - ./profiles:/profiles
    stop_grace_period: 30s
    # Docker keeps stdout forever by default; at many tasks a day that fills the disk.
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  caddy:
    image: caddy:2
    profiles: [https]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on: [orchestrator]

volumes:
  data:
  caddy-data:
