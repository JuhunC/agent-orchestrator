# Agents the orchestrator can run.
#
# Mention an agent's handle (@aorch-claude) in an issue, pull request, review or discussion,
# or assign the handle, and the orchestrator runs `command args…` in a checkout of the repo.
#
# Fields
#   name               Unique id, used in branch names (agent/<name>/issue-12) and labels.
#   handle             The GitHub login people @-mention. Pick one nobody owns, or create a
#                      machine account for it (then it can also be assigned).
#   command, args      What to run. Placeholders: {prompt} {prompt_file} {session_id}
#                      {workdir} {branch} {repo} {task_id}. If no arg contains {prompt} or
#                      {prompt_file}, the prompt is written to stdin.
#   resume_args        Used instead of `args` when this agent already has a session on the
#                      thread, so it continues the same conversation. Optional.
#   output             How to read stdout: claude-stream-json (Claude Code, Cursor CLI),
#                      codex-json, gemini-stream-json, or text. With `text`, stdout is the reply
#                      and lines starting with `::progress::` show up as progress steps.
#   env                Extra environment variables. ${NAME} is replaced from the orchestrator's
#                      environment, e.g. ANTHROPIC_API_KEY: ${TEAM_ANTHROPIC_KEY}.
#   timeout_minutes    Defaults to TASK_TIMEOUT_MINUTES (60).
#   open_pull_request  Commit, push and open/update a PR when done (default true).
#                      false = read-only agent that only replies.
#   expose_github_token  Give the agent GH_TOKEN for the repo (default false).
#   enabled            Default true. Can also be switched in the admin UI.
#
# Agents can also be added in the admin UI. Ones defined here are reloaded on every start.

agents:
  - name: claude
    handle: aorch-claude
    description: Claude Code
    command: claude
    args: [-p, --output-format, stream-json, --verbose, --dangerously-skip-permissions]
    resume_args: [-p, --resume, "{session_id}", --output-format, stream-json, --verbose, --dangerously-skip-permissions]
    output: claude-stream-json

  - name: cursor
    handle: aorch-cursor
    description: Cursor CLI (agent -p)
    command: agent
    args: [-p, --force, --output-format, stream-json, "{prompt}"]
    resume_args: [-p, --force, --output-format, stream-json, --resume, "{session_id}", "{prompt}"]
    output: claude-stream-json

  - name: codex
    handle: aorch-codex
    description: OpenAI Codex CLI
    command: codex
    args: [exec, --json, --skip-git-repo-check, --dangerously-bypass-approvals-and-sandbox, "-"]
    resume_args: [exec, resume, --json, --skip-git-repo-check, --dangerously-bypass-approvals-and-sandbox, "{session_id}", "-"]
    output: codex-json
    env:
      # `codex exec` reads CODEX_API_KEY; fall back to OPENAI_API_KEY when that's what you set.
      CODEX_API_KEY: ${OPENAI_API_KEY}

  - name: gemini
    handle: aorch-gemini
    description: Google Gemini CLI
    command: gemini
    args: [--yolo, --output-format, stream-json, -p, "Carry out the task described above."]
    resume_args: [--yolo, --output-format, stream-json, --resume, latest, -p, "Carry out the task described above."]
    output: gemini-stream-json

  # A custom agent: any command that takes a prompt works. Put the binary in
  # /opt/agents/bin (mounted from ./agents-bin on the server) or bake it into the image.
  #
  # - name: my-claude
  #   handle: aorch-my-claude
  #   description: Our in-house wrapper around Claude
  #   command: myClaude
  #   args: [-p, "{prompt}"]
  #   output: text
  #   env:
  #     ANTHROPIC_API_KEY: ${MY_CLAUDE_API_KEY}
